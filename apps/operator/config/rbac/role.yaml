apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-factory-operator
rules:
- apiGroups: ["ai.teaglebuilt.io"]
  resources:
    - modelprojects
    - experiments
    - modelruns
    - modelartifacts
    - modelreleases
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["ai.teaglebuilt.io"]
  resources:
    - modelprojects/status
    - experiments/status
    - modelruns/status
    - modelartifacts/status
    - modelreleases/status
  verbs: ["get", "update", "patch"]
- apiGroups: ["ai.teaglebuilt.io"]
  resources:
    - modelprojects/finalizers
    - experiments/finalizers
    - modelruns/finalizers
    - modelartifacts/finalizers
    - modelreleases/finalizers
  verbs: ["update"]
