apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-factory-operator
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-factory-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-factory-operator
    spec:
      serviceAccountName: model-factory-operator
      containers:
      - name: manager
        image: controller:latest
        imagePullPolicy: IfNotPresent
        args:
          - --leader-elect
          - --metrics-bind-address=:8080
          - --health-probe-bind-address=:8081
        env:
          - name: DAGSTER_GRAPHQL_URL
            value: http://dagster-webserver:3000/graphql
          - name: DAGSTER_REPOSITORY_LOCATION
            value: model_factory
          - name: DAGSTER_REPOSITORY_NAME
            value: __repository__
          - name: DAGSTER_JOB_NAME
            value: foundation_model_job
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
