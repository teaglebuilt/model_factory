[project]
name = "model-factory"
version = "0.2.0"
description = "Application framework for reproducible model training, evaluation, and promotion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.8",
  "dagster>=1.8",
  "dagster-k8s>=0.24",
]

[project.optional-dependencies]
training = [
  "torch>=2.4",
  "transformers>=4.44",
  "datasets>=3.0",
  "trl>=0.11",
]

[project.scripts]
model-factory = "model_factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
