schema_version: v1
metadata:
  name: coder-150m-v001
  description: Initial small coding foundation-model experiment used to validate the factory.
dataset:
  repository: foundation-data
  ref: main
  path: code/pretraining-v1
tokenizer:
  name: coder-v1
  vocab_size: 32000
model:
  family: llama
  architecture: models/architectures/llama.yaml
  parameters:
    hidden_size: 768
    num_layers: 12
    num_attention_heads: 12
    max_sequence_length: 4096
pretraining:
  backend: torchtitan
  seed: 42
  batch_size: 8
  gradient_accumulation_steps: 8
  optimizer:
    type: adamw
    learning_rate: 0.0003
    weight_decay: 0.1
  scheduler:
    type: cosine
    warmup_steps: 1000
  checkpoints:
    interval: 1000
finetuning:
  enabled: true
  backend: trl
  dataset:
    repository: foundation-data
    ref: main
    path: instruction/v1
runtime:
  queue: gpu
  resources:
    gpu: 1
    cpu: 8
    memory: 32Gi
outputs:
  checkpoint_store: s3://model-factory/checkpoints
  model_store: s3://model-factory/models
