schema_version: v1

metadata:
  name: smoke-10m-v001
  description: Tiny smoke experiment used to validate the Model Factory execution path.

datasets:
  pretraining:
    uri: platform-data://foundation-models/code-pretrain@smoke-v1

tokenizer:
  name: coder-v1
  vocab_size: 32000

preparation:
  packing:
    strategy: concat
    sequence_length: 1024
  shuffle: true

model:
  family: llama
  architecture: models/architectures/llama.yaml
  parameters:
    hidden_size: 256
    num_layers: 4
    num_attention_heads: 4
    max_sequence_length: 1024

pretraining:
  backend: torchtitan
  seed: 42
  max_steps: 100
  batch_size: 2
  gradient_accumulation_steps: 1
  optimizer:
    type: adamw
    learning_rate: 0.0003
    weight_decay: 0.1
  scheduler:
    type: cosine
    warmup_steps: 10
  checkpoints:
    interval: 50

finetuning:
  enabled: false

runtime:
  queue: gpu
  resources:
    gpu: 1
    cpu: 4
    memory: 16Gi

outputs:
  checkpoint_store: s3://model-factory/checkpoints
  model_store: s3://model-factory/models
